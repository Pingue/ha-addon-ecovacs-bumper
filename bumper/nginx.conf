load_module /usr/lib/nginx/modules/ngx_stream_module.so;

error_log stderr;
pid /tmp/nginx.pid;

events { }

stream {
    # Newer robot/app firmware connects to port 443 expecting MQTT, not HTTPS.
    # Peek at the (plaintext) SNI from the TLS ClientHello and route accordingly,
    # same logic as bumper's own example nginx config. ssl_preread does not
    # terminate TLS, so no certificate is needed here - bumper handles that.
    resolver 127.0.0.11 ipv6=off;
    map_hash_bucket_size 64;

    map $ssl_preread_server_name $internalport {
        # hostnames containing "mq" -> MQTT broker
        ~^.*(mq).*\.eco(vacs|user)\.(net|com)$    8883;

        # other eco(vacs|user) hostnames -> HTTPS confserver
        ~^.*eco(vacs|user)\.(net|com)$            443;

        # bots connecting directly by IP send no SNI -> MQTT broker
        default                                   8883;
    }

    server {
        listen 9443;
        ssl_preread on;
        proxy_pass 127.0.0.1:$internalport;
    }
}
